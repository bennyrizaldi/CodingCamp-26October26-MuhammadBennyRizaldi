<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense & Budget Visualizer</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <noscript><p class="noscript">JavaScript is required to use this app.</p></noscript>

  <div class="page">
    <!-- HEADER: ganti div jadi header -->
    <header class="card center">
      <h1>Expense & Budget Visualizer</h1>
      <p class="small-label">TOTAL BALANCE</p>
      <p id="total-balance">Rp 0</p>
      <div id="banner" role="status"></div>
      <div id="error-region"></div>
    </header>

    <!-- MAIN CONTENT -->
    <main>
      <!-- SECTION 1: Add Transaction -->
      <section class="card" aria-labelledby="form-heading">
        <h2 id="form-heading" class="card-title">Add Transaction</h2>
        <form id="transaction-form" novalidate>
          <div class="field">
            <label for="item-name">Item Name</label>
            <input type="text" id="item-name" name="item-name" maxlength="100">
          </div>
          <div class="field">
            <label for="amount">Amount</label>
            <input type="number" id="amount" name="amount" step="0.01">
          </div>
          <div class="field">
            <label for="category">Category</label>
            <select id="category" name="category">
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
          </div>
          <button type="submit">Add Transaction</button>
        </form>
      </section>

      <!-- 2 KOLOM BAWAH -->
      <div class="two-col">
        <section class="card" aria-labelledby="list-heading">
          <h2 id="list-heading" class="card-title">Transactions</h2>
          <div id="transaction-list"></div>
        </section>

        <section class="card" aria-labelledby="chart-heading">
          <h2 id="chart-heading" class="card-title">Spending by Category</h2>
          <canvas id="pie-chart" width="340" height="340"></canvas>
          <div id="chart-no-data" style="display:none"></div>
          <div id="chart-error" style="display:none"></div>
        </section>
      </div>
    </main>
  </div>

<script src="js/app.js"></script>
</body>
</html>
